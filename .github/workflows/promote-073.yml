name: Promote DNS Inspector 0.7.3

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply TrackerDB commit fix
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 \
            -o /tmp/app072.py \
            https://raw.githubusercontent.com/Shadow1719/dns-inspector/50c89c40ba07316f8eaf40479bce6258af96e9c3/app.py
          cp /tmp/app072.py app.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          old = '''        with _open_trackerdb(newdb) as c:\n            _execute_sql_file(c, tmp)\n            c.execute("PRAGMA journal_mode=DELETE")\n            c.commit()\n'''
          new = '''        with _open_trackerdb(newdb) as c:\n            _execute_sql_file(c, tmp)\n            c.execute("PRAGMA journal_mode=DELETE")\n'''
          if old not in s:
              raise SystemExit('TrackerDB commit block not found')
          p.write_text(s.replace(old, new, 1))
          Path('VERSION').write_text('0.7.3\n')
          PY
          python -m py_compile app.py
          grep -n -A6 -B2 'with _open_trackerdb(newdb)' app.py

      - name: Commit 0.7.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .github
          rm -f .github/workflows/promote-073.yml
          git add app.py VERSION
          git commit -m 'release: DNS Inspector v0.7.3'
          git push origin main
