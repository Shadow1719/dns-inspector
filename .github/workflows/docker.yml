name: Build and publish Docker image

on:
  push:
    branches: ["main", "dev-0.8"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "dev-0.8"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 0.8.0: nothing is published unless the suite passes first.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stable,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev-0.8' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Read application version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Fetch official vendor favicons
        shell: bash
        run: |
          set -u
          mkdir -p static/vendor-favicons
          fetch() {
            name="$1"; shift
            for url in "$@"; do
              echo "Fetching official $name favicon from $url"
              tmp="static/vendor-favicons/$name.tmp"
              if curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 -A "Mozilla/5.0 (DNS Inspector build)" "$url" -o "$tmp"; then
                mime="$(file --brief --mime-type "$tmp" 2>/dev/null || true)"
                case "$mime" in
                  image/*)
                    mv -f "$tmp" "static/vendor-favicons/$name.ico"
                    echo "Fetched $name favicon ($mime)"
                    return 0
                    ;;
                  *)
                    echo "Ignoring non-image response for $name: $mime"
                    rm -f "$tmp"
                    ;;
                esac
              fi
            done
            echo "Warning: could not fetch an official favicon for $name; generic device icon will be used."
            rm -f "static/vendor-favicons/$name.ico" "static/vendor-favicons/$name.tmp"
            return 0
          }
          fetch dell https://www.dell.com/favicon.ico https://www.dell.com/favicon.png
          fetch lg https://www.lg.com/favicon.ico https://www.lg.com/favicon.png
          fetch zte https://www.zte.com.cn/favicon.ico https://www.zte.com.cn/favicon.png
          fetch bosch https://www.bosch.com/favicon.ico https://www.bosch.com/favicon.png
          fetch roborock https://ro.roborock.com/favicon.ico https://global.roborock.com/favicon.ico https://ro.roborock.com/favicon.png https://global.roborock.com/favicon.png
          fetch petkit https://www.petkit.com/favicon.ico https://www.petkit.com/favicon.png

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image starts and answers /health
        run: |
          set -e
          docker build -t dns-inspector:ci --build-arg APP_VERSION=${{ steps.version.outputs.version }} .
          docker run -d --name dns-inspector-ci -p 8080:8080 \
            -e DB_PATH=/data/inspector.db \
            -e TRACKERDB_URL=http://127.0.0.1:9/trackerdb.sql \
            dns-inspector:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo "health check passed"
              docker rm -f dns-inspector-ci
              exit 0
            fi
            sleep 2
          done
          echo "health check never succeeded"
          docker logs dns-inspector-ci
          docker rm -f dns-inspector-ci
          exit 1

      - name: Package source archive and create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -qr "dns-inspector-${VERSION}.zip" . -x '.git/*' 'dns-inspector-*.zip'
          gh release create "${GITHUB_REF_NAME}" "dns-inspector-${VERSION}.zip" \
            --title "DNS Inspector ${VERSION}" \
            --generate-notes \
            --latest
