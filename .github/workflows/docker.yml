name: Build and publish Docker image

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shadow1719/dns-inspector

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read application version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Select branch image tag
        id: branch_tag
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.branch_tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            RUNTIME_ENV=${{ github.ref == 'refs/heads/dev' && 'development' || 'production' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image starts and answers /health
        run: |
          set -e
          docker build -t dns-inspector:ci             --build-arg APP_VERSION=${{ steps.version.outputs.version }} .
          docker run -d --name dns-inspector-ci -p 8080:8080             -e DB_PATH=/data/inspector.db             -e TRACKERDB_URL=http://127.0.0.1:9/trackerdb.sql             dns-inspector:ci
          trap 'docker logs dns-inspector-ci 2>/dev/null || true; docker rm -f dns-inspector-ci 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "health check never succeeded"
          exit 1

      - name: Package source archive and create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -qr "dns-inspector-${VERSION}.zip" . -x '.git/*' 'dns-inspector-*.zip'
          gh release create "${GITHUB_REF_NAME}" "dns-inspector-${VERSION}.zip"             --title "DNS Inspector ${VERSION}"             --generate-notes             --latest
