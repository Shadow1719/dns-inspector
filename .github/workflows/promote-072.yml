name: Promote DNS Inspector 0.7.2

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild and validate 0.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 \
            -o /tmp/app071.py \
            https://raw.githubusercontent.com/Shadow1719/dns-inspector/d6f094e590a358667e5cabeb1fca6a00fb352b48/app.py
          cp /tmp/app071.py app.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text()
          s = s.replace('def hostname_for_ip(ip):', 'def hostname_for_ip(ip, allow_network=True):', 1)
          s = s.replace('    hostname = ""\n    try:\n        hostname = socket.gethostbyaddr(ip)[0].rstrip(".")', '    hostname = ""\n    if not allow_network:\n        return ""\n    try:\n        hostname = socket.gethostbyaddr(ip)[0].rstrip(".")', 1)
          s = s.replace('def mac_vendor_lookup(mac):', 'def mac_vendor_lookup(mac, allow_network=True):', 1)
          s = s.replace('    vendor = ""\n    try:\n        r = requests.get(f"{MACVENDOR_URL}/{quote(mac, safe=\'\')}", timeout=8)', '    vendor = ""\n    if not allow_network:\n        return ""\n    try:\n        r = requests.get(f"{MACVENDOR_URL}/{quote(mac, safe=\'\')}", timeout=8)', 1)
          old = '''def enrich_device_network_identity(c, device_key, ips, mac, hostname_hint=""):
              hostname = str(hostname_hint or "").strip()
              if not hostname:
                  for ip in ips or []:
                      hostname = hostname_for_ip(ip)
                      if hostname:
                          break
              vendor = mac_vendor_lookup(mac) if mac else ""
              row = c.execute("SELECT hostname,mac,vendor FROM devices WHERE device_key=?", (device_key,)).fetchone()
              if not row:
                  return hostname, vendor
              # Keep an AdGuard-provided hostname ahead of reverse DNS unless the DB is empty.
              final_hostname = row[0] or hostname
              final_mac = mac or row[1]
              final_vendor = vendor or row[2]
              c.execute("UPDATE devices SET hostname=?, mac=?, vendor=? WHERE device_key=?", (final_hostname, final_mac, final_vendor, device_key))
              return final_hostname, final_vendor
          '''
          new = '''_enrich_guard = threading.Lock()
          _enrich_inflight = set()

          def _schedule_device_network_enrichment(device_key, ips, mac, hostname_hint=""):
              key = str(device_key or "")
              if not key:
                  return
              with _enrich_guard:
                  if key in _enrich_inflight:
                      return
                  _enrich_inflight.add(key)

              def run():
                  try:
                      hostname = str(hostname_hint or "").strip()
                      if not hostname:
                          for ip in ips or []:
                              hostname = hostname_for_ip(ip, allow_network=True)
                              if hostname:
                                  break
                      vendor = mac_vendor_lookup(mac, allow_network=True) if mac else ""
                      with db_lock, sqlite3.connect(DB_PATH) as c:
                          row = c.execute("SELECT hostname,mac,vendor FROM devices WHERE device_key=?", (key,)).fetchone()
                          if row:
                              final_hostname = row[0] or hostname
                              final_mac = mac or row[1]
                              final_vendor = vendor or row[2]
                              c.execute("UPDATE devices SET hostname=?, mac=?, vendor=? WHERE device_key=?", (final_hostname, final_mac, final_vendor, key))
                              c.commit()
                  except Exception as e:
                      print("device enrichment error:", repr(e), flush=True)
                  finally:
                      with _enrich_guard:
                          _enrich_inflight.discard(key)

              threading.Thread(target=run, daemon=True, name="device-enrich").start()

          def enrich_device_network_identity(c, device_key, ips, mac, hostname_hint=""):
              # Critical-path enrichment is cache-only. Network lookups are deferred to a
              # background worker so an ingest/reconcile transaction never blocks the UI.
              hostname = str(hostname_hint or "").strip()
              if not hostname:
                  for ip in ips or []:
                      hostname = hostname_for_ip(ip, allow_network=False)
                      if hostname:
                          break
              vendor = mac_vendor_lookup(mac, allow_network=False) if mac else ""
              row = c.execute("SELECT hostname,mac,vendor FROM devices WHERE device_key=?", (device_key,)).fetchone()
              if not row:
                  _schedule_device_network_enrichment(device_key, ips, mac, hostname)
                  return hostname, vendor
              # Keep an AdGuard-provided hostname ahead of reverse DNS unless the DB is empty.
              final_hostname = row[0] or hostname
              final_mac = mac or row[1]
              final_vendor = vendor or row[2]
              c.execute("UPDATE devices SET hostname=?, mac=?, vendor=? WHERE device_key=?", (final_hostname, final_mac, final_vendor, device_key))
              if not final_hostname or (mac and not final_vendor):
                  _schedule_device_network_enrichment(device_key, ips, mac, final_hostname)
              return final_hostname, final_vendor
          '''
          if old not in s:
              raise SystemExit('0.7.1 enrich function not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          Path('VERSION').write_text('0.7.2\n')
          PY
          python -m py_compile app.py
          test "$(wc -c < app.py)" -eq 137140
          test "$(sha256sum app.py | cut -d' ' -f1)" = "0beabcb3c083e5215ef216a8e997aeb2f0155cf9b1a909f860bdb45d425f56ef"

      - name: Commit 0.7.2
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github
          rm -f .github/workflows/promote-072.yml tools/dns-inspector-0.7.2.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py VERSION tools/dns-inspector-0.7.2.patch .github/workflows/promote-072.yml
          git commit -m 'release: DNS Inspector v0.7.2'
          git push origin main
