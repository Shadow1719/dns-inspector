name: Promote staged 0.7 payload

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  promote:
    if: ${{ hashFiles('tools/app07/*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconstruct DNS Inspector 0.7.0
        shell: bash
        run: |
          set -euo pipefail
          cat tools/app07/aa tools/app07/ab tools/app07/ac tools/app07/ad tools/app07/ae > /tmp/app07.b64
          base64 -d /tmp/app07.b64 | gunzip > app.py
          printf '0.7.0\n' > VERSION
          python -m py_compile app.py
          test "$(wc -c < app.py)" -gt 100000
          rm -rf tools/app07
      - name: Commit promoted release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py VERSION tools/app07
          git commit -m 'release: promote DNS Inspector v0.7.0'
          git push origin main
