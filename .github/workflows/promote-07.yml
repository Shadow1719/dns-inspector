name: Promote staged 0.7 payload

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and validate DNS Inspector 0.7.0
        shell: bash
        run: |
          set -euo pipefail
          for f in aa ab ac ad ae; do
            test -f "tools/app07/$f"
          done
          cat tools/app07/aa tools/app07/ab tools/app07/ac tools/app07/ad > /tmp/app07.b64
          printf '2dJ0' >> /tmp/app07.b64
          cat tools/app07/ae >> /tmp/app07.b64
          printf '=' >> /tmp/app07.b64
          base64 -d /tmp/app07.b64 | gunzip > app.py
          test "$(wc -c < app.py)" -eq 132563
          sha256sum app.py
          printf '9cbf29517b07e235b04364ce8f9c506d02da1ad987b2380eda67b8ddc19cb95f  app.py\n' | sha256sum -c -
          python -m py_compile app.py
          printf '0.7.0\n' > VERSION

      - name: Commit promoted release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/app07
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py VERSION tools/app07
          git commit -m 'release: promote DNS Inspector v0.7.0'
          git push origin main
